# PERPOS VPS — Contabo SG (Cloud VPS 4: 4 vCPU / 8GB)
# เว็บ 3 โปรเจกต์ + Caddy (reverse proxy + auto TLS) · เมล (Stalwart) จะเพิ่มทีหลังในเฟส 2
#
# โครงบนเครื่อง (สร้างครั้งเดียวตอน setup):
#   /srv/apps/<app>/current   → artifact ล่าสุด (symlink ไป releases/<ts> — CI สลับให้)
#   /srv/apps/<app>/.env      → runtime env ของแอปนั้น (chmod 600, ไม่อยู่ใน git)
#   /srv/caddy/Caddyfile      → copy จาก repo นี้
#
# หมายเหตุ: ไม่ build image ต่อแอป — ใช้ node:22-alpine mount artifact ที่ CI rsync มา
# ⇒ deploy = สลับ symlink + `docker compose restart <app>` (ไม่กินแรมเครื่องเลย)
#   · perpos ใช้ blue/green (switch-perpos.sh) จึงไม่มีช่วง 502 ตอน deploy — แอปอื่นยัง restart ตรง ๆ

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # API token สิทธิ์ Zone.DNS:Edit ของ zone ที่ใช้ (สำหรับ DNS-01 — จำเป็นเพราะอยู่หลัง
      # Cloudflare proxy ซึ่งทำให้ HTTP-01 ไม่นิ่ง)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    # ให้ Caddy proxy ไป Stalwart ที่รันบน host (native) ได้
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  # perpos — blue/green 2 ตัว (zero-downtime deploy, 2026-08-19): ปกติรันทีละสี อีกสี stopped
  # deploy = deploy/vps/switch-perpos.sh: up สีว่างจาก release ใหม่ → รอ /api/health ผ่าน → drain สีเก่า
  # (แตะ /tmp/perpos-drain ให้ health ตอบ 503 → Caddy หยุดส่ง) → stop สีเก่า · Caddy `lb_policy first`
  # ชอบ blue ก่อน (ดู Caddyfile) · ไม่ publish port ออก host — cron บน host ยิงผ่าน Caddy 443 แทน
  # ⚠️ ห้ามรัน `docker compose up -d` เฉย ๆ แล้วหวังว่าจะสลับ release — ต้องผ่านสคริปต์เท่านั้น
  perpos-blue: &perpos
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    # standalone ของ monorepo: server.js อยู่ที่ apps/perpos/server.js ภายใน artifact
    command: node apps/perpos/server.js
    environment:
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    env_file: /srv/apps/perpos/.env
    volumes:
      # symlink ถูก resolve ตอน container start ⇒ สลับ symlink แล้ว container ที่รันอยู่ยังเห็น release เก่า
      # (นี่คือหัวใจของ blue/green: สีเก่าเสิร์ฟต่อได้ระหว่างสีใหม่ boot)
      - /srv/apps/perpos/current:/app:ro
      # artifact mount เป็น :ro แต่ Next ต้องเขียน .next/cache (image optimization / ISR)
      # — ไม่มี volume นี้ = EROFS ทุก request ที่แตะ cache · สองสีแชร์ volume เดียวได้ (cache key ตาม build)
      - perpos_next_cache:/app/apps/perpos/.next/cache
    networks: [web]
    # กัน memory leak ลามทั้งเครื่อง — แอปเดียวพังไม่ดึงเมล/แอปอื่นตาย
    mem_limit: 1536m
    # หยุด = SIGTERM แล้วรอ 30 วิ (สคริปต์ drain ก่อนหยุดอยู่แล้ว — นี่คือเผื่อ request ที่ค้าง)
    stop_grace_period: 30s

  perpos-green:
    <<: *perpos

  # scheduler worker ของ perpos — process ยาวแทน cron ยิง HTTP ทุกนาที (ตั้งแต่ 2026-08-19)
  # artifact/env เดียวกับ perpos · ไฟล์ bundle โดย CI (`pnpm build:worker`) · logic = lib/scheduler/run.ts
  # ⚠️ ต้องมี instance เดียว (ห้าม scale) — มี lease ใน DB กันซ้อนอีกชั้นถ้าเผลอ
  perpos-worker:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: node apps/perpos/worker/scheduler-worker.js
    environment:
      NODE_ENV: production
    env_file: /srv/apps/perpos/.env
    volumes:
      - /srv/apps/perpos/current:/app:ro
    networks: [web]
    # graceful shutdown: worker รอรอบปัจจุบันจบก่อน exit (เพดาน 100 วิในโค้ด) — ให้เวลามากกว่านั้น
    stop_grace_period: 120s
    mem_limit: 512m

  exapp:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: node apps/exapp/server.js # TODO: ปรับ path ตามโครง standalone ของ repo exapp
    environment:
      PORT: "3006"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    env_file: /srv/apps/exapp/.env
    volumes:
      - /srv/apps/exapp/current:/app:ro
      # artifact mount เป็น :ro (สลับ symlink ตอน deploy ได้ปลอดภัย) แต่ Next ต้องเขียน
      # .next/cache (image optimization / ISR) — ไม่มี volume นี้ = EROFS ทุก request ที่แตะ cache
      - exapp_next_cache:/app/apps/exapp/.next/cache
    ports:
      - "127.0.0.1:3006:3006"
    networks: [web]
    mem_limit: 1024m

  riekchang:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: node apps/riekchang/server.js # TODO: ปรับ path ตามโครง standalone ของ repo riekchang
    environment:
      PORT: "3007"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    env_file: /srv/apps/riekchang/.env
    volumes:
      - /srv/apps/riekchang/current:/app:ro
      # artifact mount เป็น :ro (สลับ symlink ตอน deploy ได้ปลอดภัย) แต่ Next ต้องเขียน
      # .next/cache (image optimization / ISR) — ไม่มี volume นี้ = EROFS ทุก request ที่แตะ cache
      - riekchang_next_cache:/app/apps/riekchang/.next/cache
    ports:
      - "127.0.0.1:3007:3007"
    networks: [web]
    mem_limit: 1024m

  # ── เฟส 2: เมล (หลังผ่าน gate port 25 + blacklist เท่านั้น) ──────────────────
  # stalwart:
  #   image: stalwartlabs/mail-server:latest
  #   restart: unless-stopped
  #   ports:
  #     - "25:25"      # SMTP (ต้องขอ Contabo ปลดล็อกก่อน)
  #     - "465:465"    # submissions
  #     - "587:587"    # submission
  #     - "993:993"    # IMAPS
  #     - "127.0.0.1:8080:8080"  # JMAP/admin — เข้าผ่าน Caddy เท่านั้น
  #   volumes:
  #     - /srv/stalwart:/opt/stalwart-mail
  #   networks: [web]

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  perpos_next_cache:
  exapp_next_cache:
  riekchang_next_cache:
