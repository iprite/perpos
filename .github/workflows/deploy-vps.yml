# Deploy perpos → Contabo SG VPS
# ท่า: build standalone ใน CI (เครื่อง 16GB — ห้าม build บน VPS 8GB, เคย OOM บน Vercel มาแล้ว)
#      → อัปโหลด R2 → VPS ดึงไป releases/<ts> → สลับ symlink `current` → blue/green switch (zero-downtime)
#        (deploy/vps/switch-app.sh: up สีว่าง → รอ health → drain สีเก่า → stop — ไม่มีช่วง 502)
#
# ยังไม่ active จนกว่าจะตั้ง secrets ครบ (ดู deploy/vps/README.md):
#   VPS_HOST · VPS_USER · VPS_SSH_KEY (private key)
#   NEXT_PUBLIC_SUPABASE_URL · NEXT_PUBLIC_SUPABASE_ANON_KEY (+ NEXT_PUBLIC_* อื่นที่ใช้)
# NEXT_PUBLIC_* ถูก inline ตอน build — เปลี่ยนค่าแล้วต้อง build ใหม่ (เหมือน Vercel)
# ส่วน env ฝั่ง server (service role, LINE, ฯลฯ) อยู่ที่ /srv/apps/perpos/.env บนเครื่อง อ่านตอน runtime

name: deploy-vps

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    # build เฉพาะเมื่อโค้ดของแอปเปลี่ยน — commit ที่แก้แต่ docs/deploy config ไม่ต้อง build 6 นาที
    # (เทียบเท่า turbo-ignore บน Vercel) · แก้ env ฝั่ง server ไม่ต้อง deploy (อยู่บนเครื่อง restart พอ)
    paths:
      - "apps/perpos/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-vps.yml"
      - "deploy/vps/switch-app.sh"

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false # อย่ายกเลิก deploy ที่กำลังสลับ symlink กลางคัน

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (standalone)
        working-directory: apps/perpos
        env:
          BUILD_STANDALONE: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://app.perpos.ai
          NEXT_PUBLIC_LINE_ADD_FRIEND_URL: ${{ secrets.NEXT_PUBLIC_LINE_ADD_FRIEND_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: pnpm build

      # scheduler worker (container perpos-worker) — bundle แยกด้วย esbuild ให้พกทุก dependency ในไฟล์เดียว
      # (standalone มีเฉพาะ node_modules ที่ Next trace ให้ server.js) · NEXT_PUBLIC_* inline จาก env นี้
      - name: Build scheduler worker
        working-directory: apps/perpos
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://app.perpos.ai
        run: pnpm build:worker

      - name: Assemble artifact
        run: |
          set -euo pipefail
          OUT=apps/perpos/.next/standalone
          # standalone ไม่รวม static assets กับ public — ต้อง copy เข้าไปเองเสมอ
          # ใช้ `cp -r src/. dst/` ไม่ใช่ `cp -r src dst` — ถ้าปลายทางมีอยู่แล้ว (standalone บางครั้ง
          # สร้าง public/ มาเองจากไฟล์ที่ config อ้าง เช่น favicon) แบบหลังจะวางซ้อนเป็น public/public/
          # → static ทุกไฟล์ 404 (เคยเจอกับ exapp: โลโก้หาย)
          mkdir -p "$OUT/apps/perpos/.next/static" "$OUT/apps/perpos/public"
          cp -r apps/perpos/.next/static/. "$OUT/apps/perpos/.next/static/"
          cp -r apps/perpos/public/. "$OUT/apps/perpos/public/"
          # ต้องมีโฟลเดอร์นี้ในก้อน artifact: /app ถูก mount แบบ :ro บนเครื่อง Docker จึงสร้าง
          # mountpoint ให้ volume .next/cache เองไม่ได้ (read-only file system) → container ไม่ขึ้น
          mkdir -p "$OUT/apps/perpos/.next/cache"
          # worker bundle → container perpos-worker รัน node apps/perpos/worker/scheduler-worker.js
          mkdir -p "$OUT/apps/perpos/worker"
          cp apps/perpos/.next/worker/scheduler-worker.js "$OUT/apps/perpos/worker/"
          # สคริปต์สลับ blue/green ไปกับ release (เวอร์ชันเดียวกับโค้ด · rollback ก็ใช้ตัวใน current/deploy/)
          mkdir -p "$OUT/deploy"
          cp deploy/vps/switch-app.sh "$OUT/deploy/"
          tar -C "$OUT" -czf artifact.tar.gz .

      # เส้นทาง GitHub (runner scp ก็ดี / Actions artifact API ก็ดี) → Contabo SG ช้ามาก (~40 KB/s
      # ค้างเป็นสิบนาที) เพราะ storage อยู่ US ไม่มี CDN · Cloudflare R2 มี CDN → VPS ดึงได้ ~17 MB/s
      # ⇒ push ขึ้น R2 แล้วให้ VPS ดึงด้วย presigned URL อายุสั้น (ไม่มี secret โผล่ในคำสั่งฝั่ง VPS)
      - name: Upload artifact → R2
        id: r2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          EP: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          KEY="perpos/${GITHUB_SHA::12}-${GITHUB_RUN_ID}.tar.gz"
          aws s3 cp artifact.tar.gz "s3://deploy-artifacts/$KEY" --endpoint-url "$EP" --only-show-errors
          URL=$(aws s3 presign "s3://deploy-artifacts/$KEY" --endpoint-url "$EP" --expires-in 900)
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Activate on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ART_URL: ${{ steps.r2.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          TS=$(date +%Y%m%d%H%M%S)
          APP=/srv/apps/perpos
          # ส่ง URL ทาง stdin ไม่ใช่ argv → ไม่โผล่ใน ps บนเครื่อง
          printf '%s' "$ART_URL" | ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" "set -euo pipefail
            cd $APP && mkdir -p releases/$TS
            curl -sSf --retry 3 --retry-delay 5 -o art.tgz \"\$(cat)\"
            tar -xzf art.tgz -C releases/$TS && rm -f art.tgz
            # ป้าย commit ของ release นี้ — heartbeat อ่านไปโชว์ที่ /admin/system (ตรวจว่า prod รัน sha ไหน)
            printf '%s\n' '${{ github.sha }}' > releases/$TS/RELEASE
            ln -sfn $APP/releases/$TS $APP/current
            # blue/green: สีใหม่ต้องผ่าน /api/health ก่อน traffic ย้าย · ล้ม = สีเก่ายังเสิร์ฟ + exit 1 (deploy แดง)
            bash $APP/releases/$TS/deploy/switch-app.sh perpos 3005 perpos-worker
            # เก็บ 3 release ล่าสุดพอ (rollback = ln -sfn ไป release ก่อนหน้า + bash current/deploy/switch-app.sh perpos 3005 perpos-worker)
            cd $APP/releases && ls -1t | tail -n +4 | xargs -r rm -rf"

      - name: Cleanup R2 (เก็บไฟล์ล่าสุด 5 ก้อนต่อแอป)
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          EP: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3api list-objects-v2 --bucket deploy-artifacts --prefix perpos/ --endpoint-url "$EP" \
            --query 'sort_by(Contents,&LastModified)[:-5].Key' --output text 2>/dev/null \
            | tr '\t' '\n' | grep -v '^None$' | while read -r k; do
              [ -n "$k" ] && aws s3 rm "s3://deploy-artifacts/$k" --endpoint-url "$EP" --only-show-errors; done || true

      - name: Health check
        run: |
          sleep 8
          curl -sf -o /dev/null -w "%{http_code}\n" --resolve app.perpos.ai:443:${{ secrets.VPS_HOST }} https://app.perpos.ai/ | grep -qE "^(200|307|308)$"

      # แจ้งผล deploy ทาง LINE (super_admin) ทุกครั้ง — สำเร็จ/ล้ม/ยกเลิก · ใช้ secret ชุดเดียวกับ uptime.yml
      # (ยิงตรงไป LINE ไม่ผ่านแอป — deploy ที่ล้มอาจทำให้แอปตอบไม่ได้)
      - name: Notify LINE (ผล deploy)
        if: always()
        env:
          LINE_TOKEN: ${{ secrets.LINE_MESSAGING_CHANNEL_ACCESS_TOKEN }}
          LINE_IDS: ${{ secrets.ALERT_LINE_USER_IDS }}
          STATUS: ${{ job.status }}
          TITLE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_IDS" ]; then
            echo "::warning::ขาด secret LINE_MESSAGING_CHANNEL_ACCESS_TOKEN หรือ ALERT_LINE_USER_IDS — ข้ามการแจ้งเตือน"
            exit 0
          fi
          case "$STATUS" in
            success)   ICON="✅"; HEAD="deploy perpos ขึ้น VPS แล้ว";;
            cancelled) ICON="⚪"; HEAD="deploy perpos ถูกยกเลิก";;
            *)         ICON="🔴"; HEAD="deploy perpos ล้มเหลว — prod ยังเป็น release เดิม";;
          esac
          FIRST_LINE=$(printf '%s' "$TITLE" | head -n1 | cut -c1-120)
          MSG="$ICON $HEAD
          $FIRST_LINE
          ${SHA:0:12} · $(TZ=Asia/Bangkok date '+%d/%m %H:%M')
          $RUN_URL"
          IFS=','
          for id in $LINE_IDS; do
            id=$(echo "$id" | xargs)
            [ -z "$id" ] && continue
            payload=$(jq -n --arg to "$id" --arg text "$MSG" '{to:$to, messages:[{type:"text", text:$text}]}')
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" -o /dev/null -w "LINE push -> $id: HTTP %{http_code}\n"
          done
