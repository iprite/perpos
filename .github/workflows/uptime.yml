name: Uptime check

# เช็คจาก "ข้างนอก" (GitHub) — ถ้าแอปล่ม endpoint แจ้งเตือนในแอปก็ล่มด้วย
# จึงต้องยิง LINE ตรงจากที่นี่ ไม่ผ่าน /api/admin/alerts/uptime
# ครอบ 3 แอป + webmail บน VPS SG (perpos/exapp/riekchang อยู่เครื่องเดียวกัน — ตัวเฝ้าใน perpos
# เห็น exapp/riekchang ก็จริง แต่ถ้าเครื่องดับทั้งตัวจะเงียบ ด่านนี้คือด่านนอกจริง)
on:
  schedule:
    - cron: "*/5 * * * *" # ทุก ~5 นาที (GitHub cron อาจ delay ช่วง peak — เป็นเรื่องปกติ)
  workflow_dispatch: {} # กดทดสอบเองได้

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check ทุกแอปบน VPS (retry 3 ครั้ง กัน blip ชั่วคราว)
        id: check
        run: |
          # ชื่อ|URL|สิ่งที่ต้องเจอใน body (ว่าง = แค่ HTTP 200) — 3 แอป + webmail อยู่เครื่องเดียวกัน
          TARGETS=(
            "PERPOS|https://app.perpos.ai/api/health|\"ok\":true"
            "exapp|https://app.exworker.co.th/|"
            "riekchang|https://app.riekchang.com/|"
            "PERPOS Mail|https://mail.perpos.ai/login|"
            "Mail OAuth (login.perpos.ai → Stalwart)|https://login.perpos.ai/.well-known/oauth-authorization-server|issuer"
          )
          down_list=""
          for t in "${TARGETS[@]}"; do
            IFS='|' read -r name url must <<<"$t"
            ok=""; code="000"
            for i in 1 2 3; do
              code=$(curl -sL -m 15 -o body.txt -w "%{http_code}" "$url" || echo "000")
              body=$(cat body.txt 2>/dev/null || echo "")
              if [ "$code" = "200" ] && { [ -z "$must" ] || printf '%s' "$body" | grep -q "$must"; }; then
                ok=1; break
              fi
              [ "$i" -lt 3 ] && sleep 10
            done
            if [ -n "$ok" ]; then
              echo "✅ $name healthy"
            else
              echo "🔴 $name down (last HTTP $code)"
              down_list="${down_list}• ${name} — HTTP ${code} (${url})%0A"
            fi
          done
          if [ -z "$down_list" ]; then
            echo "down=" >> "$GITHUB_OUTPUT"
          else
            echo "down=1" >> "$GITHUB_OUTPUT"
            # เก็บหลายบรรทัดใน output ด้วย %0A แล้วค่อยแปลงตอนประกอบข้อความ
            echo "down_list=$down_list" >> "$GITHUB_OUTPUT"
          fi
      # ── self-healing: ล่ม → ลอง restart เอง 1 ครั้ง (ผ่าน switch-app.sh = zero-downtime) → เช็คซ้ำ ──
      # กันวน: จำเวลา restart ล่าสุดไว้ใน actions/cache — ถ้าเพิ่ง restart ไปใน 30 นาที ไม่ทำซ้ำ (แจ้ง 🔴 ให้คนดูแทน)
      - name: ดูว่าเพิ่ง auto-restart ไปหรือยัง
        if: steps.check.outputs.down == '1'
        id: last
        uses: actions/cache/restore@v4
        with:
          path: .uptime-restart
          key: uptime-restart-${{ github.run_id }}
          restore-keys: uptime-restart-
      - name: Auto-restart แอปที่ล่ม (ครั้งเดียว ไม่วน)
        if: steps.check.outputs.down == '1'
        id: heal
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOWN_LIST: ${{ steps.check.outputs.down_list }}
        run: |
          set -uo pipefail
          now=$(date +%s); last=$(cat .uptime-restart/ts 2>/dev/null || echo 0)
          if [ -z "$VPS_HOST" ] || [ -z "$SSH_KEY" ]; then echo "result=skip" >> "$GITHUB_OUTPUT"; echo "ไม่มี secret VPS — ข้าม auto-restart"; exit 0; fi
          if (( now - last < 1800 )); then
            echo "result=recent" >> "$GITHUB_OUTPUT"; echo "เพิ่ง auto-restart เมื่อ $(( (now-last)/60 )) นาทีก่อน — ไม่ทำซ้ำ (ให้คนดู)"; exit 0
          fi
          # แปลชื่อที่ล่ม → คำสั่งบนเครื่อง (choice ปิด — ไม่มีอะไรจาก input คนภายนอกไหลเข้า)
          cmds=""
          printf '%s' "$DOWN_LIST" | grep -q '• PERPOS —\|• PERPOS Mail —' && cmds="$cmds perpos"
          printf '%s' "$DOWN_LIST" | grep -q '• exapp —'      && cmds="$cmds exapp"
          printf '%s' "$DOWN_LIST" | grep -q '• riekchang —'  && cmds="$cmds riekchang"
          printf '%s' "$DOWN_LIST" | grep -q '• Mail OAuth'   && cmds="$cmds stalwart"
          n=$(printf '%s' "$DOWN_LIST" | grep -o '•' | wc -l)
          [ "$n" -ge 5 ] && cmds="caddy $cmds"   # ล่มทุกตัว = น่าจะ Caddy/เครือข่าย → restart Caddy ก่อน
          echo "จะ restart:$cmds"
          mkdir -p ~/.ssh; echo "$SSH_KEY" > ~/.ssh/id_up && chmod 600 ~/.ssh/id_up
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > remote.sh <<'EOS'
          set -uo pipefail; cd /srv/deploy
          sw() { local s=/srv/apps/$1/current/deploy/switch-app.sh; [ -f "$s" ] || s=/srv/deploy/switch-app.sh; bash "$s" "$@"; }
          rc=0
          for c in "$@"; do
            echo "── restart $c"
            case "$c" in
              caddy)     docker compose restart caddy ;;
              perpos)    sw perpos 3005 perpos-worker ;;
              exapp)     sw exapp 3006 ;;
              riekchang) sw riekchang 3007 ;;
              stalwart)  systemctl restart stalwart ;;
            esac || rc=1
          done
          exit $rc
          EOS
          ssh -i ~/.ssh/id_up -o ConnectTimeout=25 -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" "S=\$(cat); bash -c \"\$S\" heal$cmds" < remote.sh 2>&1 | tail -n 40
          rc=${PIPESTATUS[0]}
          # 255 = ssh ต่อไม่ได้ (เครื่อง/เครือข่ายดับ) · อื่น ๆ = ต่อได้แต่ restart ล้ม (เช่น สีใหม่ไม่ผ่าน health)
          if [ "$rc" = "0" ]; then echo "result=restarted" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = "255" ]; then echo "result=ssh_failed" >> "$GITHUB_OUTPUT"; echo "ssh เข้าเครื่องไม่ได้ (rc=255)"
          else echo "result=restart_failed" >> "$GITHUB_OUTPUT"; echo "ssh ได้แต่ restart ล้ม (rc=$rc)"; fi
          mkdir -p .uptime-restart && echo "$now" > .uptime-restart/ts
      - name: จำเวลา auto-restart
        if: contains('restarted ssh_failed restart_failed', steps.heal.outputs.result)
        uses: actions/cache/save@v4
        with:
          path: .uptime-restart
          key: uptime-restart-${{ github.run_id }}
      - name: เช็คซ้ำหลัง restart
        if: steps.heal.outputs.result == 'restarted'
        id: recheck
        run: |
          sleep 20
          still=""
          for t in "PERPOS|https://app.perpos.ai/api/health" "exapp|https://app.exworker.co.th/" "riekchang|https://app.riekchang.com/" "PERPOS Mail|https://mail.perpos.ai/login" "Mail OAuth|https://login.perpos.ai/.well-known/oauth-authorization-server"; do
            IFS='|' read -r name url <<<"$t"
            code=$(curl -sL -m 15 -o /dev/null -w "%{http_code}" "$url" || echo 000)
            [ "$code" = "200" ] || still="${still}• ${name} — HTTP ${code}%0A"
          done
          echo "still=$still" >> "$GITHUB_OUTPUT"
      - name: Alert LINE (ยิงตรงไป LINE — survive ตอนแอปดับ)
        if: steps.check.outputs.down == '1'
        env:
          LINE_TOKEN: ${{ secrets.LINE_MESSAGING_CHANNEL_ACCESS_TOKEN }}
          LINE_IDS: ${{ secrets.ALERT_LINE_USER_IDS }}
          HEAL: ${{ steps.heal.outputs.result }}
          STILL: ${{ steps.recheck.outputs.still }}
          OPS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ops-vps.yml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LINE_TOKEN" ] || [ -z "$LINE_IDS" ]; then
            echo "::warning::ขาด secret LINE_MESSAGING_CHANNEL_ACCESS_TOKEN หรือ ALERT_LINE_USER_IDS — ข้ามการแจ้งเตือน"
            exit 0
          fi
          LIST=$(printf '%s' '${{ steps.check.outputs.down_list }}' | sed 's/%0A/\n/g')
          STAMP=$(TZ=Asia/Bangkok date '+%d/%m %H:%M')
          case "$HEAL" in
            restarted)
              if [ -z "$STILL" ]; then
                MSG="🟡 เว็บบน VPS ล่มชั่วครู่ — restart อัตโนมัติแล้วกลับมาปกติ
          $(printf "$LIST")
          $STAMP · ไม่ต้องทำอะไร (ดู log: $RUN_URL)"
              else
                MSG="🔴 restart อัตโนมัติแล้วยังไม่ขึ้น — ต้องคนดู
          $(printf "$LIST" | sed 's/^/ก่อน: /')
          $(printf '%s' "$STILL" | sed 's/%0A/\n/g' | sed 's/^/ยังล่ม: /')
          $STAMP · สั่งเพิ่ม: $OPS_URL (status / logs / rollback)"
              fi ;;
            recent)
              MSG="🔴 เว็บบน VPS ยังล่ม (เพิ่ง auto-restart ไปใน 30 นาที — ไม่ทำซ้ำ)
          $(printf "$LIST")
          $STAMP · สั่งเอง: $OPS_URL (status / logs / rollback)" ;;
            restart_failed)
              MSG="🔴 restart อัตโนมัติล้ม (ssh ได้ แต่แอปบูตไม่ผ่าน health — release อาจพัง) — ต้องคนดู
          $(printf "$LIST")
          $STAMP · ลอง rollback: $OPS_URL (rollback-perpos / logs-perpos)" ;;
            ssh_failed)
              MSG="🔴 เว็บบน VPS ล่ม และ ssh เข้าเครื่องไม่ได้ (เครื่องอาจดับทั้งตัว)
          $(printf "$LIST")
          $STAMP · เช็ค Contabo panel / รอ reboot · $OPS_URL" ;;
            *)
              MSG="🔴 เว็บบน VPS SG อาจล่ม (เช็คจากข้างนอก — GitHub Actions)
          $(printf "$LIST")
          $STAMP · สั่งดู/แก้จากมือถือ: $OPS_URL" ;;
          esac
          IFS=','
          for id in $LINE_IDS; do
            id=$(echo "$id" | xargs)
            [ -z "$id" ] && continue
            payload=$(jq -n --arg to "$id" --arg text "$MSG" '{to:$to, messages:[{type:"text", text:$text}]}')
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" -o /dev/null -w "LINE push -> $id: HTTP %{http_code}\n"
          done
